<title>Stacja pogodowa</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#071018;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
#app{padding:14px 18px}
#top{position:relative;height:255px}
#left{position:absolute;left:0;top:0}
#right{position:absolute;right:0;top:0;text-align:right}
#clock{font-size:220px;font-weight:bold;line-height:.9}
#date{font-size:21px;color:#c3d0d8;margin-top:8px}
#place{font-size:18px;color:#a9bbc7}
#current{font-size:60px;font-weight:bold;margin-top:5px}
#current img{width:58px;height:58px;vertical-align:middle}
#desc{font-size:22px}
.detail{font-size:15px;color:#c7d4de;margin-top:6px}
.line{height:1px;background:#29404f;margin:12px 0}
#hours,#days{text-align:center;white-space:nowrap}
.hour{display:inline-block;width:16%;vertical-align:top;font-size:16px}
.day{display:inline-block;width:19%;vertical-align:top;font-size:15px}
.ico img{width:42px;height:42px}
.temp,.temps{font-size:20px;font-weight:bold}
#status{position:absolute;right:7px;bottom:3px;font-size:10px;color:#71828e}
</style>

function E(x){return document.getElementById(x)}
function pad(n){return n<10?"0"+n:n}
function tick(){var d=new Date();E("clock").innerHTML=pad(d.getHours())+":"+pad(d.getMinutes());E("date").innerHTML=DAYS[d.getDay()]+" "+d.getDate()+" "+MONTHS[d.getMonth()]+" "+d.getFullYear()}
setInterval(tick,1000);tick();
function wi(c,day){
 if(c===0)return ["Bezchmurnie",day?"sun":"moon"];
 if(c===1)return ["Pogodnie",day?"sun":"moon"];
 if(c===2)return ["Czesciowe zachmurzenie","part"];
 if(c===3)return ["Pochmurno","cloud"];
 if(c===45||c===48)return ["Mgla","fog"];
 if(c>=51&&c<=67)return ["Deszcz","rain"];
 if(c>=71&&c<=77)return ["Snieg","snow"];
 if(c>=80&&c<=82)return ["Przelotny deszcz","rain"];
 if(c>=85&&c<=86)return ["Przelotny snieg","snow"];
 if(c>=95)return ["Burza","storm"];
 return ["Pogoda","cloud"];
}
function pic(n){return '<img src="'+ICONS[n]+'" alt="">'}
function req(url,ok,bad){var x=new XMLHttpRequest();x.onreadystatechange=function(){if(x.readyState===4){if(x.status>=200&&x.status<300){try{ok(JSON.parse(x.responseText))}catch(e){bad()}}else bad()}};x.open("GET",url,true);try{x.send(null)}catch(e){bad()}}
function hm(s){return s?s.substring(11,16):"--:--"}
function load(){
 var u="https://api.open-meteo.com/v1/forecast?latitude="+LAT+"&longitude="+LON+"&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,is_day&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=Europe%2FWarsaw&forecast_days=7";
 req(u,function(d){
  var c=d.current,a=wi(c.weather_code,c.is_day===1);E("nowIcon").innerHTML=pic(a[1]);E("temp").innerHTML=Math.round(c.temperature_2m)+" C";E("desc").innerHTML=a[0];
  E("details").innerHTML="Odczuwalna "+Math.round(c.apparent_temperature)+" C | Wilgotnosc "+c.relative_humidity_2m+"% | Wiatr "+Math.round(c.wind_speed_10m)+" km/h";
  E("sun").innerHTML="Wschod "+hm(d.daily.sunrise[0])+" | Zachod "+hm(d.daily.sunset[0]);
  var now=new Date(),s=0,i,j,k,a2,h="";
  for(i=0;i<d.hourly.time.length;i++){if(new Date(d.hourly.time[i])>=now){s=i;break}}
  for(j=0;j<6;j++){k=s+j;a2=wi(d.hourly.weather_code[k],1);h+='<div class="hour"><div>'+d.hourly.time[k].substring(11,16)+'</div><div class="ico">'+pic(a2[1])+'</div><div class="temp">'+Math.round(d.hourly.temperature_2m[k])+' C</div></div>'}E("hours").innerHTML=h;
  var o="",q,dt,a3;for(q=0;q<5;q++){dt=new Date(d.daily.time[q]+"T12:00:00");a3=wi(d.daily.weather_code[q],1);o+='<div class="day"><div>'+DAYS[dt.getDay()]+'</div><div class="ico">'+pic(a3[1])+'</div><div class="temps">'+Math.round(d.daily.temperature_2m_max[q])+' / '+Math.round(d.daily.temperature_2m_min[q])+' C</div></div>'}E("days").innerHTML=o;
  E("status").innerHTML="Aktualizacja "+pad(new Date().getHours())+":"+pad(new Date().getMinutes());
 },function(){E("desc").innerHTML="Brak polaczenia z pogoda";E("status").innerHTML="Ponawiam automatycznie"})
}
load();setInterval(load,900000);
